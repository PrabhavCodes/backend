services:
  server:
    build:
      context: ./server  # Set correct path
      dockerfile: Dockerfile # Use correct Dockerfile name
    ports:
      - "8000:8000"  # Expose backend API
    volumes:
      - ./server:/server  # Ensure correct mounting
    environment:
      - PYTHONPATH=/server
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
